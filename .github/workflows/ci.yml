name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONUTF8: "1"

jobs:
  source-checkout:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/runtime.txt
      - name: Install dependencies without installing the project
        shell: bash
        run: |
          python - <<'PYREQ' > /tmp/source-checkout-requirements.txt
          import tomllib
          from pathlib import Path

          payload = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          for requirement in payload["project"]["dependencies"]:
              print(requirement)
          for requirement in payload["project"]["optional-dependencies"]["dev"]:
              print(requirement)
          PYREQ
          python -m pip install --upgrade pip
          python -m pip install -c constraints/runtime.txt -r /tmp/source-checkout-requirements.txt
      - name: Test source checkout without package installation
        env:
          PYTHONPATH: src
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest
          python -m ev_fleet --help

  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/runtime.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c constraints/runtime.txt -e ".[dev]"
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONUTF8: "1"
      - run: ev-fleet run --config configs/smoke.yaml
      - run: ev-fleet validate --config configs/smoke.yaml

  package:
    timeout-minutes: 30
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/runtime.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c constraints/runtime.txt -e ".[dev]"
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build
      - name: Verify wheel in an isolated environment and external working directory
        run: |
          python -m venv /tmp/evfleet-wheel-env
          /tmp/evfleet-wheel-env/bin/python -m pip install --upgrade pip
          /tmp/evfleet-wheel-env/bin/python -m pip install -c constraints/runtime.txt dist/*.whl
          /tmp/evfleet-wheel-env/bin/python -m pip check
          mkdir -p /tmp/evfleet-wheel-work/configs
          cp configs/smoke.yaml /tmp/evfleet-wheel-work/configs/smoke.yaml
          cd /tmp/evfleet-wheel-work
          /tmp/evfleet-wheel-env/bin/ev-fleet run --config configs/smoke.yaml
          /tmp/evfleet-wheel-env/bin/ev-fleet validate --config configs/smoke.yaml
      - run: python scripts/check_reproducibility.py --config configs/smoke.yaml
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
